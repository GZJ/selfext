[project]
name = "selfext-gui"
version = "0.1.0"
description = "PySide6 desktop interface for selfext"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
selfextg = "selfext_gui.app:main"

[dependency-groups]
build = ["pyinstaller>=6.12,<7"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfext_gui"]
