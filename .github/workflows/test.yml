name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install using checked-in extractors
        run: go install .
      - run: go test -tags=integration ./...
      - run: go vet ./...
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: gui/uv.lock
      - name: Build native CLI for GUI tests
        run: go build -o target/ .
        env:
          CGO_ENABLED: "0"
      - name: Test PySide6 GUI with locked dependencies
        run: uv run --project gui --locked python -m unittest discover -s gui/tests -v
